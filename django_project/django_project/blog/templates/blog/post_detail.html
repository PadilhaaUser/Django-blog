{% extends "blog/base.html" %}
{% load blog_extras %}
{% block content %}
    <article class="media content-section">
        <img src="{{ object.author.profile.image.url }}" class="rounded-circle article-img" alt="Profile Picture">
        <div class="media-body">
            <div class="article-metadata">
                <a class="mr-2" href="#">{{ object.author }}</a>
                <small class="text-muted">{{ object.created_at|format_pt_short_date }}</small>
            </div>
            {% if object.author == user %}
                <div class="float-right">
                    <a class="btn btn-secondary btn-sm mt-4" href="{% url 'post-update' object.id %}">Update</a>
                    <a class="btn btn-danger btn-sm mt-4" href="{% url 'post-delete' object.id %}">Delete</a>
                </div>
            {% endif %}
            <h2 class="article-title" >{{ object.title }}</h2>
            <p class="article-content">{{ object.content }}</p>
        </div>
    </article>
{% endblock %}
